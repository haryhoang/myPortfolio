<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 340" width="100%" height="100%" style="background-color: #ffffff; font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">
  <!-- Grid background subtle -->
  <defs>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#f1f5f9" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="600" height="340" fill="url(#grid)" />

  <!-- Quadrant 1: High Level Triggering -->
  <g transform="translate(40, 20)">
    <!-- Waveform -->
    <path d="M 10 45 L 30 45 L 30 20 L 55 20 L 55 45 L 75 45" fill="none" stroke="#111827" stroke-width="1.75"/>
    <path d="M 42.5 5 L 42.5 16" fill="none" stroke="#111827" stroke-width="1.25"/>
    <polygon points="39.5,14 42.5,19 45.5,14" fill="#111827"/>
    <text x="42.5" y="2" font-size="8" text-anchor="middle" fill="#374151">Triggers on high clock level</text>

    <!-- Wire to Box -->
    <path d="M 75 45 L 105 45" fill="none" stroke="#111827" stroke-width="1.5"/>
    <!-- Box -->
    <rect x="105" y="15" width="65" height="70" fill="#ffffff" stroke="#111827" stroke-width="1.75"/>
    <text x="110" y="49" font-size="9" fill="#111827" font-weight="600">CLK</text>
    <text x="157" y="35" font-size="9" fill="#111827" font-weight="600">Q</text>
    <text x="157" y="70" font-size="9" fill="#111827" font-weight="600">Q̅</text>
    <!-- Outputs -->
    <path d="M 170 32 L 195 32" fill="none" stroke="#111827" stroke-width="1.5"/>
    <path d="M 170 67 L 195 67" fill="none" stroke="#111827" stroke-width="1.5"/>
    <text x="105" y="102" font-size="9.5" text-anchor="middle" font-weight="600" fill="#111827">High Level Triggering</text>
  </g>

  <!-- Quadrant 2: Positive Edge Triggering -->
  <g transform="translate(340, 20)">
    <!-- Waveform -->
    <path d="M 10 45 L 30 45 L 30 20 L 55 20 L 55 45 L 75 45" fill="none" stroke="#111827" stroke-width="1.75"/>
    <path d="M 20 8 Q 28 12 29.5 28" fill="none" stroke="#111827" stroke-width="1.25"/>
    <polygon points="27,25 30,30 32,25" fill="#111827"/>
    <text x="20" y="2" font-size="8" text-anchor="middle" fill="#374151">Triggers on this edge</text>
    <text x="20" y="10" font-size="8" text-anchor="middle" fill="#374151">of the clock pulse</text>

    <!-- Wire to Box -->
    <path d="M 75 45 L 105 45" fill="none" stroke="#111827" stroke-width="1.5"/>
    <!-- Box with Dynamic Wedge -->
    <rect x="105" y="15" width="65" height="70" fill="#ffffff" stroke="#111827" stroke-width="1.75"/>
    <path d="M 105 40 L 115 45 L 105 50" fill="none" stroke="#111827" stroke-width="1.5"/>
    <text x="119" y="49" font-size="9" fill="#111827" font-weight="600">CLK</text>
    <text x="157" y="35" font-size="9" fill="#111827" font-weight="600">Q</text>
    <text x="157" y="70" font-size="9" fill="#111827" font-weight="600">Q̅</text>
    <!-- Outputs -->
    <path d="M 170 32 L 195 32" fill="none" stroke="#111827" stroke-width="1.5"/>
    <path d="M 170 67 L 195 67" fill="none" stroke="#111827" stroke-width="1.5"/>
    <text x="105" y="102" font-size="9.5" text-anchor="middle" font-weight="600" fill="#111827">Positive Edge Triggering</text>
  </g>

  <!-- Quadrant 3: Low Level Triggering -->
  <g transform="translate(40, 180)">
    <!-- Waveform -->
    <path d="M 10 20 L 30 20 L 30 45 L 55 45 L 55 20 L 75 20" fill="none" stroke="#111827" stroke-width="1.75"/>
    <path d="M 42.5 60 L 42.5 49" fill="none" stroke="#111827" stroke-width="1.25"/>
    <polygon points="39.5,51 42.5,46 45.5,51" fill="#111827"/>
    <text x="42.5" y="70" font-size="8" text-anchor="middle" fill="#374151">Triggers on low clock level</text>

    <!-- Wire with Inversion Bubble -->
    <path d="M 75 45 L 97 45" fill="none" stroke="#111827" stroke-width="1.5"/>
    <circle cx="101" cy="45" r="4" fill="#ffffff" stroke="#111827" stroke-width="1.5"/>
    <!-- Box -->
    <rect x="105" y="15" width="65" height="70" fill="#ffffff" stroke="#111827" stroke-width="1.75"/>
    <text x="110" y="49" font-size="9" fill="#111827" font-weight="600">CLK</text>
    <text x="157" y="35" font-size="9" fill="#111827" font-weight="600">Q</text>
    <text x="157" y="70" font-size="9" fill="#111827" font-weight="600">Q̅</text>
    <!-- Outputs -->
    <path d="M 170 32 L 195 32" fill="none" stroke="#111827" stroke-width="1.5"/>
    <path d="M 170 67 L 195 67" fill="none" stroke="#111827" stroke-width="1.5"/>
    <text x="105" y="102" font-size="9.5" text-anchor="middle" font-weight="600" fill="#111827">Low Level Triggering</text>
  </g>

  <!-- Quadrant 4: Negative Edge Triggering -->
  <g transform="translate(340, 180)">
    <!-- Waveform -->
    <path d="M 10 45 L 30 45 L 30 20 L 55 20 L 55 45 L 75 45" fill="none" stroke="#111827" stroke-width="1.75"/>
    <path d="M 70 8 Q 58 12 55.5 28" fill="none" stroke="#111827" stroke-width="1.25"/>
    <polygon points="53,25 55,30 58,25" fill="#111827"/>
    <text x="65" y="2" font-size="8" text-anchor="middle" fill="#374151">Triggers on this edge</text>
    <text x="65" y="10" font-size="8" text-anchor="middle" fill="#374151">of the clock pulse</text>

    <!-- Wire with Inversion Bubble + Wedge -->
    <path d="M 75 45 L 97 45" fill="none" stroke="#111827" stroke-width="1.5"/>
    <circle cx="101" cy="45" r="4" fill="#ffffff" stroke="#111827" stroke-width="1.5"/>
    <!-- Box -->
    <rect x="105" y="15" width="65" height="70" fill="#ffffff" stroke="#111827" stroke-width="1.75"/>
    <path d="M 105 40 L 115 45 L 105 50" fill="none" stroke="#111827" stroke-width="1.5"/>
    <text x="119" y="49" font-size="9" fill="#111827" font-weight="600">CLK</text>
    <text x="157" y="35" font-size="9" fill="#111827" font-weight="600">Q</text>
    <text x="157" y="70" font-size="9" fill="#111827" font-weight="600">Q̅</text>
    <!-- Outputs -->
    <path d="M 170 32 L 195 32" fill="none" stroke="#111827" stroke-width="1.5"/>
    <path d="M 170 67 L 195 67" fill="none" stroke="#111827" stroke-width="1.5"/>
    <text x="105" y="102" font-size="9.5" text-anchor="middle" font-weight="600" fill="#111827">Negative Edge Triggering</text>
  </g>
</svg>
