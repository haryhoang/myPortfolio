<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 340" width="100%" height="100%" style="background-color: #fafafa; font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">
  <defs>
    <pattern id="grid3" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#e2e8f0" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="600" height="340" fill="url(#grid3)" />
  <g transform="translate(30, 40)">
    <text x="0" y="20" font-size="16" font-weight="700" fill="#0f172a">Classic 5-Stage RISC-V Pipeline</text>
    <text x="0" y="40" font-size="11" fill="#64748b">Instruction-level parallelism & data hazard forwarding paths</text>
    
    <!-- 5 stages -->
    <g transform="translate(0, 70)">
      <!-- IF -->
      <rect x="0" y="0" width="95" height="130" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" />
      <rect x="0" y="0" width="95" height="28" rx="6" fill="#f8fafc" />
      <text x="47.5" y="19" font-size="11" font-weight="700" text-anchor="middle" fill="#0f172a">1. IF</text>
      <text x="47.5" y="55" font-size="9" text-anchor="middle" fill="#64748b">Instruction</text>
      <text x="47.5" y="68" font-size="9" text-anchor="middle" fill="#64748b">Fetch (PC)</text>
      <rect x="15" y="90" width="65" height="22" rx="3" fill="#e0e7ff" />
      <text x="47.5" y="105" font-size="9" font-weight="600" text-anchor="middle" fill="#3730a3">I-Mem</text>

      <!-- ID -->
      <rect x="110" y="0" width="95" height="130" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" />
      <rect x="110" y="0" width="95" height="28" rx="6" fill="#f8fafc" />
      <text x="157.5" y="19" font-size="11" font-weight="700" text-anchor="middle" fill="#0f172a">2. ID</text>
      <text x="157.5" y="55" font-size="9" text-anchor="middle" fill="#64748b">Instruction</text>
      <text x="157.5" y="68" font-size="9" text-anchor="middle" fill="#64748b">Decode & Reg</text>
      <rect x="125" y="90" width="65" height="22" rx="3" fill="#fef3c7" />
      <text x="157.5" y="105" font-size="9" font-weight="600" text-anchor="middle" fill="#92400e">Reg File</text>

      <!-- EX -->
      <rect x="220" y="0" width="95" height="130" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" />
      <rect x="220" y="0" width="95" height="28" rx="6" fill="#f8fafc" />
      <text x="267.5" y="19" font-size="11" font-weight="700" text-anchor="middle" fill="#0f172a">3. EX</text>
      <text x="267.5" y="55" font-size="9" text-anchor="middle" fill="#64748b">Execute</text>
      <text x="267.5" y="68" font-size="9" text-anchor="middle" fill="#64748b">ALU Address</text>
      <rect x="235" y="90" width="65" height="22" rx="3" fill="#dcfce7" />
      <text x="267.5" y="105" font-size="9" font-weight="600" text-anchor="middle" fill="#166534">ALU Core</text>

      <!-- MEM -->
      <rect x="330" y="0" width="95" height="130" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" />
      <rect x="330" y="0" width="95" height="28" rx="6" fill="#f8fafc" />
      <text x="377.5" y="19" font-size="11" font-weight="700" text-anchor="middle" fill="#0f172a">4. MEM</text>
      <text x="377.5" y="55" font-size="9" text-anchor="middle" fill="#64748b">Memory</text>
      <text x="377.5" y="68" font-size="9" text-anchor="middle" fill="#64748b">Access (L/S)</text>
      <rect x="345" y="90" width="65" height="22" rx="3" fill="#e0f2fe" />
      <text x="377.5" y="105" font-size="9" font-weight="600" text-anchor="middle" fill="#075985">D-Mem</text>

      <!-- WB -->
      <rect x="440" y="0" width="95" height="130" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" />
      <rect x="440" y="0" width="95" height="28" rx="6" fill="#f8fafc" />
      <text x="487.5" y="19" font-size="11" font-weight="700" text-anchor="middle" fill="#0f172a">5. WB</text>
      <text x="487.5" y="55" font-size="9" text-anchor="middle" fill="#64748b">Write Back</text>
      <text x="487.5" y="68" font-size="9" text-anchor="middle" fill="#64748b">to Register</text>
      <rect x="455" y="90" width="65" height="22" rx="3" fill="#f3e8ff" />
      <text x="487.5" y="105" font-size="9" font-weight="600" text-anchor="middle" fill="#6b21a8">Reg Mux</text>

      <!-- Forwarding paths -->
      <path d="M 377.5 130 C 377.5 180, 267.5 180, 267.5 135" fill="none" stroke="#2563eb" stroke-width="1.5" stroke-dasharray="4,3"/>
      <polygon points="265,135 267.5,130 270,135" fill="#2563eb"/>
      <text x="322.5" y="175" font-size="8.5" font-weight="600" text-anchor="middle" fill="#2563eb">MEM → EX Forwarding</text>
    </g>
  </g>
</svg>
